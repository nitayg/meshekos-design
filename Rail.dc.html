            cursor: n.href ? "pointer" : "default",
            iconBg: on ? "var(--primary-selected-color)" : "transparent",
            iconColor: on ? "var(--primary-color)" : (n.href ? "var(--icon-color)" : "var(--color-wolf_gray)"),
            isHome: n.id === "home",
            isBoard: n.id === "board",
            isMeetings: n.id === "meetings",
            isTranscribe: n.id === "transcribe",
            isReview: n.id === "review",
            isForm: n.id === "form",
            isDocs: n.id === "docs",
            isAsk: n.id === "ask",
            isTasks: n.id === "tasks"
          };
        })
      }))
    };
  }
}
</script>
</body>
